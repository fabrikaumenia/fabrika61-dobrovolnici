<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1B19">
<meta name="description" content="Šichty, podujatia a benefity pre dobrovoľníkov Fabriky 61.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fabrika 61">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Fabrika 61 – Dobrovoľníci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one quiet phone-width column for volunteers (tab bar at the bottom), a wider two-column desk for admins.
   Monochrome surfaces, brand yellow used only where something deserves attention. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --fg:#1C1B19; --muted:#6C6B65; --faint:#A6A59E;
  --line:rgba(28,27,25,.09); --line-strong:rgba(28,27,25,.16);
  --accent:#EAC51E; --accent-soft:rgba(234,197,30,.18); --ink:#1C1B19;
  --good:#23794A; --warn:#A35F00; --bad:#B42318;
  --logo-knock:#F4F4F1; --veil:rgba(244,244,241,.82); --shadow:0 10px 30px rgba(28,27,25,.10);
  --font:"Geist", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D0D0C; --surface:#171715; --fg:#F2F1EC; --muted:#9B9A92; --faint:#5F5E59;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --accent:#EAC51E; --accent-soft:rgba(234,197,30,.14); --ink:#1C1B19;
  --good:#5CC48A; --warn:#E3A43F; --bad:#F2766B;
  --logo-knock:#0D0D0C; --veil:rgba(13,13,12,.8); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D0D0C; --surface:#171715; --fg:#F2F1EC; --muted:#9B9A92; --faint:#5F5E59;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --accent:#EAC51E; --accent-soft:rgba(234,197,30,.14); --ink:#1C1B19;
  --good:#5CC48A; --warn:#E3A43F; --bad:#F2766B;
  --logo-knock:#0D0D0C; --veil:rgba(13,13,12,.8); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.has-tabs{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.02em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:440px;margin:0 auto;padding-inline:20px}
.wrap.wide{max-width:1120px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:32px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* demo bar */
.demo{border-bottom:1px solid var(--line);font-size:12px}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.demo select{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;font-size:12px}
.demo-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:3px 7px;border-radius:5px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px}

/* logo */
.logo{display:block;color:var(--fg)}
.logo svg{display:block;width:100%;height:auto}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .12s ease, opacity .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--fg);color:var(--bg)}
.btn-accent{background:var(--accent);color:var(--ink)}
.btn-ghost{background:var(--surface);border:1px solid var(--line-strong)}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 14px;border-radius:10px;font-size:13px}
.btn-xs{height:30px;padding:0 10px;border-radius:8px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.iconbtn:hover{background:var(--line);color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.input{height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px;width:100%;min-width:0}
textarea.input{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.input:focus{outline:2px solid var(--fg);outline-offset:-1px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--fg);flex:none}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--line-strong);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(20px)}

/* surfaces */
.card{background:var(--surface);border-radius:20px;padding:20px}
.card.flat{background:transparent;border:1px solid var(--line)}
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.list > *{padding:16px 20px}
.list > * + *{border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.p-muted{background:var(--line);color:var(--muted)}
.p-accent{background:var(--accent);color:var(--ink)}
.p-ink{background:var(--fg);color:var(--bg)}
.p-good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;overflow:hidden;flex:none;color:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:96px;height:96px;font-size:30px}
.avatar.sm{width:30px;height:30px;font-size:11px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* volunteer top */
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:18px 6px}
.topbar .logo{width:104px}
.pagehead{padding-block:18px 18px}
.pagehead h1{font-size:34px;letter-spacing:-.03em}
.pagehead p{color:var(--muted);margin-top:6px;font-size:14px;max-width:60ch}

/* hero count */
.hero-num{font-size:84px;line-height:.9;font-weight:300;letter-spacing:-.05em}
.cells{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:20px}
.cells i{height:8px;border-radius:2px;background:var(--line-strong)}
.cells i.on{background:var(--accent)}
.cells-lab{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right}

/* terms */
.term{display:flex;gap:16px;align-items:flex-start}
.datebox{width:48px;flex:none;text-align:center;padding-top:2px}
.datebox b{display:block;font-size:26px;font-weight:500;line-height:1;letter-spacing:-.03em}
.datebox span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.term h3{font-size:16px;letter-spacing:-.01em}
.term .meta{font-size:13px;color:var(--muted);margin-top:2px}
.term .desc{font-size:14px;margin-top:8px;color:var(--fg)}
.term .acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.type{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.type.shift::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.type.event::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--fg);margin-right:6px;vertical-align:0;box-sizing:border-box}

/* benefits */
.tier-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;padding-inline:4px}
.tier-head h2{font-size:20px}
.benefit{display:flex;flex-direction:column;gap:10px}
.benefit .partner{font-size:12px;color:var(--muted)}
.benefit .what{font-size:15px;font-weight:500}
.benefit .state{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.benefit.locked .what{color:var(--muted)}

/* news */
.post h3{font-size:18px;margin-top:6px}
.post p{margin-top:6px;font-size:14.5px;max-width:62ch}
.photos{display:grid;gap:4px;margin:14px -20px -20px;grid-template-columns:repeat(var(--n,1),1fr)}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.photos.n1 img{aspect-ratio:16/9}
.vom{background:var(--accent);color:var(--ink);border-radius:20px;padding:20px;display:flex;gap:16px;align-items:center}
.vom .avatar{background:rgba(28,27,25,.12);color:var(--ink);width:56px;height:56px;font-size:18px}
.vom .label{color:rgba(28,27,25,.65)}
.vom h3{font-size:20px;margin-top:2px}
.vom p{font-size:13px;color:rgba(28,27,25,.75)}

/* QR */
.qr{background:#fff;border-radius:16px;padding:18px;width:200px;max-width:100%;margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.qr svg rect[fill="white"],.qr svg rect[fill="#ffffff"]{fill:#fff}
.qr-code{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:20px;overflow:hidden}
.stats > div{background:var(--surface);padding:16px}
.stats b{display:block;font-size:28px;font-weight:400;letter-spacing:-.03em}
.stats span{font-size:12px;color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--veil);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-inline:8px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:11px;color:var(--faint);font-weight:500}
.tabbar button.on{color:var(--fg)}
.tabbar svg{width:24px;height:24px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* auth */
.auth{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding-block:48px}
.auth .logo{width:180px;margin-bottom:40px}
.auth h1{font-size:32px;letter-spacing:-.03em}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-strong)}

/* admin */
.ahead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px 8px;flex-wrap:wrap}
.ahead .logo{width:112px}
.anav{display:flex;gap:4px;overflow-x:auto;padding-block:8px 20px;scrollbar-width:none}
.anav button{height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.anav button.on{background:var(--fg);color:var(--bg)}
.anav .count{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--ink);border-radius:999px;padding:1px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:18px;padding:18px}
.kpi b{display:block;font-size:36px;font-weight:300;letter-spacing:-.04em;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:900px){ .cols{grid-template-columns:1fr 1fr} .cols.side{grid-template-columns:380px 1fr} .cols.side-r{grid-template-columns:1fr 420px} }
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;gap:12px}
.section-h h2{font-size:18px}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:20px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td,tbody tr.sel td{background:var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.att{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.att:first-child{border-top:0}
.scanbox{aspect-ratio:1;max-width:280px;width:100%;margin:0 auto;border-radius:24px;background:#0D0D0C;position:relative;display:grid;place-items:center;color:#9B9A92;font-size:13px;text-align:center;padding:30px}
.scanbox::before{content:"";position:absolute;inset:22%;border:2px solid var(--accent);border-radius:16px}
.scanbox::after{content:"";position:absolute;left:24%;right:24%;height:2px;background:var(--accent);top:50%;box-shadow:0 0 12px var(--accent);animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{top:26%}50%{top:72%}}

/* toast + push banner */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
body:not(.has-tabs) .toast{bottom:24px}
.push{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:min(400px,calc(100% - 24px));background:var(--veil);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;gap:12px;z-index:50;box-shadow:var(--shadow);animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
.push .app{width:38px;height:38px;border-radius:9px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none;padding:5px}
.push .app svg{width:100%}
.push small{font-size:12px;color:var(--muted)}
.push b{display:block;font-size:14px}
.push p{font-size:13px}
@keyframes drop{from{transform:translate(-50%,-120%)}to{transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){ .push{animation:none} .scanbox::after{animation:none} .btn{transition:none} }
/* voucher sheet */
body.sheet-open{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ticket{position:relative;overflow:hidden;background:var(--accent);color:var(--ink);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.ticket .label{color:rgba(28,27,25,.62)}
.ticket .tlogo{width:84px;display:block;color:var(--ink)}
.ticket .tlogo svg{width:100%;display:block}
.ticket .avatar{background:rgba(28,27,25,.12);color:var(--ink)}
.twhat{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:6px;text-wrap:balance}
.ticket.used{background:var(--surface);color:var(--fg)}
.ticket.used .label{color:var(--muted)}
.ticket.used .tlogo,.ticket.used .avatar{color:var(--fg)}
.shimmer{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);background-size:250% 100%;animation:shim 2.6s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.dots{display:flex;gap:16px;margin-top:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg)}
.dots i.on{background:var(--fg)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinerr{color:var(--bad);font-size:13px;min-height:20px}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
.keypad button{width:76px;height:76px;border-radius:50%;background:var(--surface);font-size:28px;font-weight:300;display:grid;place-items:center}
.keypad button:active{background:var(--line-strong)}
.keypad button svg{width:24px;height:24px}
.okmark{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.okmark svg{width:32px;height:32px;stroke-width:2.4}
@media (prefers-reduced-motion: reduce){ .shimmer,.dots.err{animation:none} }
/* intake form */
.fs13{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){ .grid2{grid-template-columns:1fr} }
.fset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.fset legend{font-size:15px;font-weight:600;padding:0;margin-bottom:2px}
.fset > p{margin-top:-6px}
.fset .chip,.chips .chip{height:auto;min-height:38px;padding:8px 14px;line-height:1.3;text-align:left;display:inline-flex;align-items:center;gap:6px}
.chip .ico{width:14px;height:14px;stroke-width:2.4}
.ferr{color:var(--bad);font-size:13px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--line-strong)}
.steps i.on{background:var(--fg)}
.formfoot{display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:2}
.kv{display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
/* CRM */
.count{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--ink);border-radius:999px;padding:1px 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fgrid .input{height:42px}
table.crm{min-width:1040px}
table.crm td{vertical-align:top}
.sub{font-size:12px;color:var(--muted)}
.wrapcell{max-width:220px;font-size:13px}
.sortbtn{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
.sortbtn:hover{color:var(--fg)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:26;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(40px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.drawer.in{animation:slidein .22s ease}
.drawer.wide{width:min(820px,100%)}
@keyframes slidein{from{transform:translateX(24px);opacity:.5}}
.dsec{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.dsec h3{font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dsec textarea{min-height:90px}
.tagx{display:inline-grid;place-items:center;margin-left:2px;color:inherit;opacity:.7}
.tagx .ico{width:12px;height:12px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 16px}
table.preview{min-width:0;font-size:12.5px}
table.preview td,table.preview th{white-space:nowrap;padding:8px 12px}
table.preview tbody tr{cursor:default}
@media (prefers-reduced-motion: reduce){ .drawer{animation:none} }
/* production extras */
.busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
#scan-overlay{position:fixed;inset:0;z-index:70;background:#0D0D0C;color:#F2F1EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
#scan-overlay[hidden]{display:none}
#scan-msg{text-align:center;max-width:36ch}
#scan-reader{width:min(420px,100%);border-radius:18px;overflow:hidden;background:#000}
.ico.big{width:40px;height:40px}
.scanbox{gap:10px;align-content:center}
input:disabled{opacity:.6}
@media (prefers-reduced-motion: reduce){ .busybar{animation:none;background:var(--accent)} }
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 12px}
</style>

</head>

# Týždenná záloha databázy (dobrovoľníci, účasť, benefity, novinky, prihlasovacie účty).
# Záloha je zašifrovaná heslom BACKUP_PASSPHRASE a uložená ako „artifact“ tejto úlohy na 90 dní.
# Fotky (súbory v úložisku) záloha neobsahuje, len odkazy na ne.
name: Týždenná záloha databázy
on:
  schedule:
    - cron: "13 2 * * 0"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PGHOST: aws-1-eu-west-1.pooler.supabase.com
      PGPORT: "5432"
      PGUSER: postgres.yvjqasfknlzquvoqcwni
      PGDATABASE: postgres
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Kontrola nastavenia
        run: |
          if [ -z "$PGPASSWORD" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Chýba SUPABASE_DB_PASSWORD alebo BACKUP_PASSPHRASE v Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Inštalácia pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Záloha a šifrovanie
        run: |
          set -euo pipefail
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          STAMP=$(date -u +%Y-%m-%d)
          mkdir -p out
          $PGD --format=custom --no-owner --schema=public --file=out/public.dump
          $PGD --format=custom --no-owner --data-only --table=auth.users --table=auth.identities --file=out/auth.dump
          $PGD --format=custom --no-owner --data-only --table=storage.objects --file=out/storage.dump
          tar -C out -czf backup.tar.gz .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 \
            -o "fabrika61-zaloha-$STAMP.tar.gz.gpg" backup.tar.gz
          rm -rf out backup.tar.gz
          ls -la fabrika61-zaloha-*.gpg
      - name: Uloženie zálohy
        uses: actions/upload-artifact@v4
        with:
          name: zaloha-${{ github.run_number }}
          path: fabrika61-zaloha-*.gpg
          retention-days: 90
          if-no-files-found: error
